<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마이더스K 상담 문의</title>
<!-- 2026-09-19 — 옛 통합신청폼(구글 시트로 보내던 것)은 닫았다. 예전 문자 링크로 열려도 새 신청폼으로 넘긴다.
     새 신청폼은 마이더스K 리서치센터로 바로 모인다. 옛 폼 원본은 이 레포 git 이력(6ba4e4c)에 있다. -->
<meta http-equiv="refresh" content="0; url=https://midasksegu-afk.github.io/brochure/midasK-form.html">
<script>
  // 옛 폼 번호(#06 · ?svc=06 등) → 새 폼 상품 키. 뜻이 하나로 안 갈리는 번호(01 연간 · 05 수시&정시)는 체크 없이 연다
  (function () {
    var OLD = { '00': 'p09', '02': 'p01', '03': 'p03', '04': 'p04', '06': 'c03', '07': 'p08', '08': 'p07' };
    var raw = (location.hash || '').slice(1) || (new URLSearchParams(location.search).get('svc') || '');
    var key = OLD[raw] || (/^[a-z][a-z0-9-]{1,19}$/.test(raw) ? raw : '');
    location.replace('https://midasksegu-afk.github.io/brochure/midasK-form.html' + (key ? '#' + key : ''));
  })();
</script>
</head><body style="font-family:sans-serif;padding:40px;text-align:center">
<p>새 상담 문의 페이지로 이동합니다…</p>
<p><a href="https://midasksegu-afk.github.io/brochure/midasK-form.html">바로 가기</a></p>
</body></html>
